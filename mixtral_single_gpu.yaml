model:
  model_name: mixtral

system:
  gpu_gen: H100 # NOTE: sim only wires DRAM configs for H100/B100/B200 (see device.cpp); H100 80GB HBM3 used as A100-class 80GB reference
  nvlink_gen: 4
  infiniband_gen: 400
  num_node: 1
  num_device: 1
  processor_type: GPU
  distribution:
    expert_tensor_degree: 1
    none_expert_tensor_degree: 1
  optimization:
    parallel_execution: off
    hetero_subbatch: off
    disagg_system: off
    use_low_unit_moe_only: off
    use_ramulator: off
    compressed_kv: off
    use_absorb: off
    use_flash_mla: off
    use_flash_attention: on
    reuse_kv_cache: off
    kv_cache_reuse_rate: 0.0
    prefill_mode: off
    decode_mode: off

serving:
  max_batch_size: 8
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 512
  output_len: 32
  precision_byte: 2
  skewness: 0.0
  iter: 3
  injection_rate: 0
  exit_out_of_memory: off
  mem_cap_limit: off

log:
  print_log: on
  export_gantt: off
  output_directory: ../data/
  gantt_directory: ./gantt
