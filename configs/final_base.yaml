# Final-evaluation base config for the (modified) SSD-offloading simulator.
# Same system as midterm D2 (ssd_cfgs/cpu*.yaml): 1 GPU, no expert sharding, no
# Logic-PIM, all expert weights in off-chip CPU DRAM.  prefetch/simulator.py
# fills in gpu_gen, offload_bandwidth, batch size, decode length, the mode
# (collects_gpu_compute) and the two new keys routing_trace / routing_log.
model:
  model_name: mixtral

system:
  gpu_gen: H100
  num_node: 1
  num_device: 1
  processor_type: GPU            # Logic-PIM disabled
  offload:
    collects_gpu_compute: on
    offload_expert_to_cpu_memory: on
    offload_expert_to_ssd: off
    ssd_energy_scale: 1.0
    offload_bandwidth: 5         # 5: NVLink-C2C 5.0 900 GB/s, 4: NVLink 4.0 450 GB/s
  distribution:
    expert_tensor_degree: 1      # no multi-GPU expert sharding
    none_expert_tensor_degree: 1
  optimization:
    compressed_kv: off
    use_absorb: off
    prefill_mode: off
    decode_mode: on

serving:
  max_batch_size: 1
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 512
  output_len: 66
  precision_byte: 2
  iter: 64
  injection_rate: 0
  routing_trace: none            # [new] expert ids per (slot, decode step, layer)
  routing_log: none              # [new] CSV of the experts the simulator routed

log:
  output_directory: ./tmp
