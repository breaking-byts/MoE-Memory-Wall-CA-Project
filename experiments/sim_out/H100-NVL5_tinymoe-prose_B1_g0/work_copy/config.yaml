model:
  model_name: mixtral
system:
  gpu_gen: H100
  num_node: 1
  num_device: 1
  processor_type: GPU
  offload:
    collects_gpu_compute: false
    offload_expert_to_cpu_memory: true
    offload_expert_to_ssd: false
    ssd_energy_scale: 1.0
    offload_bandwidth: 5
  distribution:
    expert_tensor_degree: 1
    none_expert_tensor_degree: 1
  optimization:
    compressed_kv: false
    use_absorb: false
    prefill_mode: false
    decode_mode: true
serving:
  max_batch_size: 1
  max_process_token: 0
simulation:
  data: synthesis
  input_len: 512
  output_len: 194
  precision_byte: 2
  iter: 192
  injection_rate: 0
  routing_trace: ../routing_trace.txt
  routing_log: ../routing_log_copy.csv
log:
  output_directory: ../csv_copy
